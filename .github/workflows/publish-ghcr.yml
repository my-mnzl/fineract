name: Publish MNZL image to GHCR

on:
  workflow_call:
    secrets:
      DEVELOCITY_ACCESS_KEY:
        required: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.event_name == 'push' && startsWith(github.ref_name, 'mnzl/')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
      REGISTRY: ghcr.io
      REGISTRY_IMAGE: ${{ github.repository }}

    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Download workspace
        id: download-workspace
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        continue-on-error: true
        with:
          name: fineract-workspace-${{ github.run_id }}
          path: .

      - name: Extract workspace
        if: steps.download-workspace.outcome == 'success'
        run: tar -xf fineract-workspace.tar

      - name: Checkout
        if: steps.download-workspace.outcome != 'success'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Build workspace fallback
        if: steps.download-workspace.outcome != 'success'
        uses: ./.github/actions/setup-and-build-fineract
        with:
          cache-read-only: false

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Derive image tags
        id: tags
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          branch_slug="$(printf '%s' "$REF_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g; s/^[.-]+//; s/[.-]+$//' | cut -c1-63)"
          if [ -z "$branch_slug" ]; then
            branch_slug=branch
          fi
          branch_hash="$(printf '%s' "$REF_NAME" | sha256sum | cut -d ' ' -f1)"
          branch_tag="${branch_slug}-${branch_hash}"
          echo "branch=$branch_tag" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login "$REGISTRY" --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and publish the custom image
        env:
          BRANCH_TAG: ${{ steps.tags.outputs.branch }}
        run: |
          ./gradlew --no-daemon --console=plain :custom:docker:jib \
            -Djib.to.image="$REGISTRY/$REGISTRY_IMAGE" \
            -Djib.to.tags="$GITHUB_SHA,$BRANCH_TAG" \
            -x test -x cucumber -x buildJavaSdk
