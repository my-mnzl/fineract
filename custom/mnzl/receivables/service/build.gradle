description = 'Purchased Receivables Service'
group = 'co.mnzl.fineract.custom'
base { archivesName = 'custom-mnzl-receivables-service' }
apply from: 'dependencies.gradle'
sourceSets.main.resources.srcDir('../openapi')

// Generated from the MNZL runtime wire schemas; JSON does not support license comments.
license {
    excludes(['**/receivables-v1.json'])
}

// Database selection is an explicit test input; real evidence must never be reused from another engine or cached run.
tasks.named('test', Test) {
    def database = providers.environmentVariable('RECEIVABLES_TEST_DATABASE')
        .orElse(providers.systemProperty('receivables.test.database')).orElse('')
    inputs.property('receivablesDatabase', database)
    environment 'RECEIVABLES_TEST_DATABASE', database.get()
    if (!database.get().isEmpty()) {
        outputs.file(layout.buildDirectory.file('receivables-database-evidence.json'))
        outputs.upToDateWhen { false }
        outputs.cacheIf { false }
    }
}

// Embed runtime evidence in the tested artifact, independently of mutable tenant configuration.
def runtimeMetadata = layout.buildDirectory.dir('generated/receivables-runtime')
tasks.register('generateReceivablesRuntime') {
    inputs.file('../openapi/receivables-v1.json')
    def sourceRevision = providers.exec {
        workingDir rootProject.projectDir
        commandLine 'git', 'rev-parse', 'HEAD'
    }.standardOutput.asText.map { it.trim() }
    inputs.property('sourceRevision', sourceRevision)
    outputs.dir(runtimeMetadata)
    doLast {
        def directory = runtimeMetadata.get().asFile
        directory.mkdirs()
        def schema = file('../openapi/receivables-v1.json').bytes
        def hash = java.security.MessageDigest.getInstance('SHA-256').digest(schema).encodeHex().toString()
        new File(directory, 'receivables-runtime.properties').text = "sourceRevision=${sourceRevision.get()}\nopenApiSha256=${hash}\n"
    }
}
sourceSets.main.resources.srcDir(runtimeMetadata)
tasks.named('processResources') { dependsOn 'generateReceivablesRuntime' }
