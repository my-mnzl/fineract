description = 'Pure Egyptian receivables financial mathematics'
group = 'co.mnzl.fineract.custom'
base { archivesName = 'custom-mnzl-receivables-math' }
// The mathematical boundary deliberately has no framework or runtime dependencies.
configurations.implementation.dependencies.clear()
configurations.compileOnly.dependencies.clear()
configurations.annotationProcessor.dependencies.clear()
configurations.testImplementation.dependencies.clear()
dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind'
}

// Canonical JSON is copied byte-for-byte from MNZL; adding a comment header would
// invalidate both JSON and the paired-build fixture hash. Java/Gradle sources
// retain their Apache headers; RAT already excludes JSON data repository-wide.
license {
    excludes(['**/reference-vectors.json'])
}
